{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Little Lemon</title>
        <link rel= 'stylesheet' href="{% static 'css/style.css' %}" />
         <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .navbarr {
            background-color: #F0E68C;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        #logo {
            width: 15%;
            height: 50px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            color: #808000;
            text-decoration: none;
            font-size: 18px;
            padding-left: 10px;
            padding-right: 10px;
        }

        nav ul li a:hover {
            color: orange;
        }
        
        .hero-section{
            background-image: 
            linear-gradient(rgba(245, 245, 220, 0.5), rgba(245, 245, 220, 0.5)),
            url("{% static 'restaurant/restaurant-inside-alternative.jpg' %}");
            width: 100%;
            height: 500px;
            background-size: cover;
            padding-bottom: 40px;
        }
        
        .sec2{
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .sec2 h1{
            color: #808000;
        }
        .chef {
            display: flex;
            flex-direction: row;
        }
        .chef img{
            width: 70%;
            height: 360px;
            padding: 6px;
            border-radius: 6%;
            padding-bottom: 40px;
        }

        .sec3{
            background-color: #808000;
            display: flex;
            align-items: center;
            flex-direction: column;
            padding-top: 30px;
            padding-bottom: 50px;
        }
        .sec3 h1{
            color: white;
        }
        .menu-img{
            display: flex;
            justify-content: center;
            flex-direction: row;
        }

        .menu-img img{
            width: 100%;
            height: 140px;
            padding: 10px;
        }
    </style>
    </head>
    <body>
        <div class="navbarr">
            <img id="logo" src="{% static 'restaurant/logo.png' %}"> 
            <nav>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="menu/">Menu</a></li>
                    <li><a href="booking/tables/">Book a Table</a></li>
                </ul>
            </nav>  
        </div>
        <div class="hero-section">
            <div class="sec2">
                <h1>We've got the best chef's in town</h2>
                <div class="chef">
                    <img src="{% static 'restaurant/head_chef.jpg' %}" alt="">
                    <img src="{% static 'restaurant/Mario-and-Adrian-b.jpg' %}" alt="">
                </div>
            </div>
            <div class="sec3">
                <h1>Our Menu</h1>
                <div class="menu-img">
                    <img src="{% static 'restaurant/Bruschetta.jpg' %}" alt="">
                    <img src="{% static 'restaurant/pasta.jpg' %}" alt="">
                    <img src="{% static 'restaurant/greek-salad.jpg' %}" alt="">
                    <img src="{% static 'restaurant/lemon-dessert-b.jpg' %}" alt="">
                </div>
            </div>
        </div>
    </body>
</html>
